<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FreightRoute India - Highway Logistics Calculator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --input-bg: #0f172a;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --green: #22c55e;
      --amber: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .title {
      font-size: 1.35rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #38bdf8;
      margin-bottom: 20px;
    }

    .form-group {
      position: relative;
      margin-bottom: 14px;
    }

    label {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 13px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: #38bdf8;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 0 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .checkbox-group input {
      width: auto;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .btn {
      width: 100%;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .results {
      margin-top: 22px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.92rem;
    }

    .result-label {
      color: var(--text-muted);
    }

    .result-val {
      font-weight: 600;
      color: #38bdf8;
    }

    .result-val.cost {
      color: var(--green);
      font-size: 1.15rem;
      font-weight: 700;
    }

    .note {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 12px;
      line-height: 1.35;
      border-left: 2px solid var(--amber);
      padding-left: 8px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2 class="title">🚚 FreightRoute India</h2>

    <div class="form-group">
      <label for="origin">Origin (Place in India)</label>
      <input type="text" id="origin" placeholder="e.g. Hyderabad" value="Hyderabad" />
    </div>

    <div class="form-group">
      <label for="destination">Destination (Place in India)</label>
      <input type="text" id="destination" placeholder="e.g. Bengaluru" value="Bengaluru" />
    </div>

    <div class="row">
      <div class="form-group">
        <label for="fuelPrice">Diesel Price (₹/L)</label>
        <input type="number" id="fuelPrice" step="0.5" value="95" />
      </div>
      <div class="form-group">
        <label for="mileage">Mileage (KM/L)</label>
        <input type="number" id="mileage" step="0.1" value="2.5" />
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label for="truckSpeed">Truck Avg Speed</label>
        <select id="truckSpeed">
          <option value="45">45 km/h (Loaded / Mountain)</option>
          <option value="50" selected>50 km/h (Standard Multi-axle)</option>
          <option value="55">55 km/h (Express Highway / Light)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="buffer">Real-world Traffic</label>
        <select id="trafficFactor">
          <option value="1.25">Highway (+25% buffer)</option>
          <option value="1.30" selected>Standard (+30% toll/traffic)</option>
          <option value="1.40">Heavy (+40% peak city/rain)</option>
        </select>
      </div>
    </div>

    <label class="checkbox-group">
      <input type="checkbox" id="includeBreaks" checked />
      Include driver rest halts (45m per 4.5h driving)
    </label>

    <button id="calculateBtn" class="btn" onclick="calculateRoute()">Calculate Route & Cost</button>

    <div class="results" id="results">
      <div class="result-row">
        <span class="result-label">Road Distance:</span>
        <span class="result-val" id="resDistance">-</span>
      </div>
      <div class="result-row">
        <span class="result-label">Car Duration (Traffic Est.):</span>
        <span class="result-val" id="resCarDuration">-</span>
      </div>
      <div class="result-row">
        <span class="result-label">Commercial Truck ETA:</span>
        <span class="result-val" id="resTruckDuration">-</span>
      </div>
      <div class="result-row">
        <span class="result-label">Total Diesel Needed:</span>
        <span class="result-val" id="resDieselNeeded">-</span>
      </div>
      <div class="result-row">
        <span class="result-label">Total Fuel Cost:</span>
        <span class="result-val cost" id="resFuelCost">-</span>
      </div>
    </div>

    <p class="note">
      *Car durations calibrated with Indian NH toll plaza wait times and bypass real-world delays.
    </p>
  </div>

  <script>
    // Optimized coordinates matching key logistics hubs
    const LOCAL_HUBS = {
      "hyderabad": { lat: 17.3850, lon: 78.4867 },
      "bengaluru": { lat: 12.9716, lon: 77.5946 },
      "bangalore": { lat: 12.9716, lon: 77.5946 },
      "chennai": { lat: 13.0827, lon: 80.2707 },
      "mumbai": { lat: 19.0760, lon: 72.8777 },
      "delhi": { lat: 28.6139, lon: 77.2090 },
      "pune": { lat: 18.5204, lon: 73.8567 },
      "kolkata": { lat: 22.5726, lon: 88.3639 },
      "ahmedabad": { lat: 23.0225, lon: 72.5714 },
      "vijayawada": { lat: 16.5062, lon: 80.6480 },
      "nagpur": { lat: 21.1458, lon: 79.0882 }
    };

    const cache = new Map();

    async function geocode(placeName) {
      const key = placeName.trim().toLowerCase();
      if (!key) return null;

      if (LOCAL_HUBS[key]) return LOCAL_HUBS[key];
      if (cache.has(key)) return cache.get(key);

      try {
        const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(placeName)}&limit=1`);
        const data = await res.json();
        if (data?.features?.length > 0) {
          const coords = {
            lon: data.features[0].geometry.coordinates[0],
            lat: data.features[0].geometry.coordinates[1]
          };
          cache.set(key, coords);
          return coords;
        }
      } catch (e) {
        console.warn("Photon lookup failed, trying backup", e);
      }

      const backup = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=in&limit=1&q=${encodeURIComponent(placeName)}`);
      const bData = await backup.json();
      if (bData?.length > 0) {
        const coords = { lat: parseFloat(bData[0].lat), lon: parseFloat(bData[0].lon) };
        cache.set(key, coords);
        return coords;
      }
      return null;
    }

    function formatTime(totalMinutes) {
      const h = Math.floor(totalMinutes / 60);
      const m = Math.round(totalMinutes % 60);
      return `${h}h ${m}m`;
    }

    async function calculateRoute() {
      const origin = document.getElementById("origin").value.trim();
      const dest = document.getElementById("destination").value.trim();
      const price = parseFloat(document.getElementById("fuelPrice").value) || 0;
      const mileage = parseFloat(document.getElementById("mileage").value) || 1;
      const truckSpeed = parseFloat(document.getElementById("truckSpeed").value) || 50;
      const trafficFactor = parseFloat(document.getElementById("trafficFactor").value) || 1.30;
      const includeBreaks = document.getElementById("includeBreaks").checked;

      const btn = document.getElementById("calculateBtn");
      if (!origin || !dest) return;

      btn.disabled = true;
      btn.innerText = "Computing optimal route...";

      try {
        const [origCoord, destCoord] = await Promise.all([geocode(origin), geocode(dest)]);

        if (!origCoord || !destCoord) {
          alert("Location could not be found. Please check spelling.");
          return;
        }

        const url = `https://router.project-osrm.org/route/v1/driving/${origCoord.lon},${origCoord.lat};${destCoord.lon},${destCoord.lat}?overview=false`;
        const res = await fetch(url);
        const data = await res.json();

        if (!data.routes?.length) {
          alert("No route found between these locations.");
          return;
        }

        const route = data.routes[0];
        const distKm = route.distance / 1000;

        // Realistic Car Time (Applying highway factor for realistic ETA)
        const rawCarMinutes = route.duration / 60;
        const realisticCarMinutes = rawCarMinutes * trafficFactor;

        // Commercial Truck calculation
        const pureTruckHours = distKm / truckSpeed;
        let truckTotalMinutes = pureTruckHours * 60;

        if (includeBreaks) {
          const breaksCount = Math.floor(pureTruckHours / 4.5);
          truckTotalMinutes += (breaksCount * 45); // 45-minute pause per 4.5 hrs
        }

        // Fuel and Costs
        const litres = distKm / mileage;
        const cost = Math.round(litres * price);

        document.getElementById("resDistance").innerText = `${distKm.toFixed(1)} km`;
        document.getElementById("resCarDuration").innerText = formatTime(realisticCarMinutes);
        document.getElementById("resTruckDuration").innerText = formatTime(truckTotalMinutes);
        document.getElementById("resDieselNeeded").innerText = `${litres.toFixed(1)} Litres`;
        document.getElementById("resFuelCost").innerText = `₹ ${cost.toLocaleString('en-IN')}`;

      } catch (err) {
        console.error(err);
        alert("Failed to compute route. Check your network connection.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Calculate Route & Cost";
      }
    }
  </script>
</body>
</html>
