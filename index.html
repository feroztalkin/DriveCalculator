<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>FreightRoute India - Fuel & Route Calc</title>
        <style>
            * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
                body { background-color: #121820; color: #e2e8f0; margin: 0; padding: 16px; display: flex; justify-content: center; }
                    .card { background: #1a222d; border-radius: 14px; padding: 20px; width: 100%; max-width: 480px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
                        h2 { margin: 0 0 16px; font-size: 1.25rem; color: #38bdf8; text-align: center; }
                            .form-group { margin-bottom: 14px; position: relative; }
                                label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; color: #94a3b8; display: block; margin-bottom: 6px; }
                                    input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 0.95rem; }
                                        input:focus { outline: none; border-color: #38bdf8; }
                                            .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: #1e293b; border: 1px solid #334155; border-radius: 8px; max-height: 180px; overflow-y: auto; z-index: 10; margin-top: 4px; padding: 0; list-style: none; }
                                                .suggestions li { padding: 10px 12px; font-size: 0.85rem; border-bottom: 1px solid #334155; cursor: pointer; }
                                                    .suggestions li:hover { background: #334155; }
                                                        .row { display: flex; gap: 12px; }
                                                            .row .form-group { flex: 1; }
                                                                button { width: 100%; padding: 14px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 8px; }
                                                                    button:hover { background: #1d4ed8; }
                                                                        .results { margin-top: 20px; padding: 16px; background: #0f172a; border-radius: 10px; border: 1px solid #1e293b; }
                                                                            .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1e293b; font-size: 0.9rem; }
                                                                                .stat-row:last-child { border-bottom: none; }
                                                                                    .stat-val { font-weight: bold; color: #38bdf8; }
                                                                                        .highlight { color: #4ade80; font-size: 1.1rem; }
                                                                                          </style>
                                                                                          </head>
                                                                                          <body>

                                                                                          <div class="card">
                                                                                            <h2>🚚 FreightRoute India</h2>

                                                                                              <!-- Origin -->
                                                                                                <div class="form-group">
                                                                                                    <label>Origin (Place in India)</label>
                                                                                                        <input type="text" id="origin" placeholder="Type city or area..." autocomplete="off">
                                                                                                            <ul id="origin-list" class="suggestions" style="display:none;"></ul>
                                                                                                              </div>

                                                                                                                <!-- Destination -->
                                                                                                                  <div class="form-group">
                                                                                                                      <label>Destination (Place in India)</label>
                                                                                                                          <input type="text" id="destination" placeholder="Type destination..." autocomplete="off">
                                                                                                                              <ul id="dest-list" class="suggestions" style="display:none;"></ul>
                                                                                                                                </div>

                                                                                                                                  <!-- Inputs -->
                                                                                                                                    <div class="row">
                                                                                                                                        <div class="form-group">
                                                                                                                                              <label>Diesel Price (₹/L)</label>
                                                                                                                                                    <input type="number" id="fuelPrice" value="98.50" step="0.1">
                                                                                                                                                        </div>
                                                                                                                                                            <div class="form-group">
                                                                                                                                                                  <label>Mileage (km/L)</label>
                                                                                                                                                                        <input type="number" id="mileage" value="2.5" step="0.1">
                                                                                                                                                                            </div>
                                                                                                                                                                              </div>

                                                                                                                                                                                <button id="calcBtn" onclick="calculateRoute()">Calculate Route & Cost</button>

                                                                                                                                                                                  <!-- Output -->
                                                                                                                                                                                    <div class="results" id="resultsBlock" style="display:none;">
                                                                                                                                                                                        <div class="stat-row"><span>Road Distance:</span><span class="stat-val" id="resDist">-</span></div>
                                                                                                                                                                                            <div class="stat-row"><span>Normal Car Duration:</span><span class="stat-val" id="resDuration">-</span></div>
                                                                                                                                                                                                <div class="stat-row"><span>Heavy Truck (at 50 km/h):</span><span class="stat-val" id="resTruckDuration">-</span></div>
                                                                                                                                                                                                    <div class="stat-row"><span>Total Diesel Needed:</span><span class="stat-val" id="resFuel">-</span></div>
                                                                                                                                                                                                        <div class="stat-row"><span>Total Fuel Cost:</span><span class="stat-val highlight" id="resCost">-</span></div>
                                                                                                                                                                                                          </div>
                                                                                                                                                                                                          </div>

                                                                                                                                                                                                          <script>
                                                                                                                                                                                                          let startCoords = null;
                                                                                                                                                                                                          let endCoords = null;

                                                                                                                                                                                                          // India-only autocomplete using Nominatim OpenStreetMap
                                                                                                                                                                                                          function setupAutocomplete(inputId, listId, onSelect) {
                                                                                                                                                                                                            const input = document.getElementById(inputId);
                                                                                                                                                                                                              const list = document.getElementById(listId);
                                                                                                                                                                                                                let debounceTimer;

                                                                                                                                                                                                                  input.addEventListener('input', () => {
                                                                                                                                                                                                                      clearTimeout(debounceTimer);
                                                                                                                                                                                                                          const query = input.value.trim();
                                                                                                                                                                                                                              if (query.length < 3) {
                                                                                                                                                                                                                                    list.style.display = 'none';
                                                                                                                                                                                                                                          return;
                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                  debounceTimer = setTimeout(async () => {
                                                                                                                                                                                                                                                        try {
                                                                                                                                                                                                                                                                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=in&q=${encodeURIComponent(query)}`);
                                                                                                                                                                                                                                                                        const data = await res.json();
                                                                                                                                                                                                                                                                                list.innerHTML = '';
                                                                                                                                                                                                                                                                                        if (data.length > 0) {
                                                                                                                                                                                                                                                                                                  list.style.display = 'block';
                                                                                                                                                                                                                                                                                                            data.slice(0, 5).forEach(item => {
                                                                                                                                                                                                                                                                                                                        const li = document.createElement('li');
                                                                                                                                                                                                                                                                                                                                    li.textContent = item.display_name;
                                                                                                                                                                                                                                                                                                                                                li.onclick = () => {
                                                                                                                                                                                                                                                                                                                                                              input.value = item.display_name.split(',')[0];
                                                                                                                                                                                                                                                                                                                                                                            list.style.display = 'none';
                                                                                                                                                                                                                                                                                                                                                                                          onSelect({ lat: item.lat, lon: item.lon });
                                                                                                                                                                                                                                                                                                                                                                                                      };
                                                                                                                                                                                                                                                                                                                                                                                                                  list.appendChild(li);
                                                                                                                                                                                                                                                                                                                                                                                                                            });
                                                                                                                                                                                                                                                                                                                                                                                                                                    } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                              list.style.display = 'none';
                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                            } catch (e) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    console.error(e);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }, 350);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                setupAutocomplete('origin', 'origin-list', coords => startCoords = coords);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                setupAutocomplete('destination', 'dest-list', coords => endCoords = coords);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Routing calculation using public OSRM engine
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                async function calculateRoute() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (!startCoords || !endCoords) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      alert("Please select both places from the dropdown suggestions.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const btn = document.getElementById('calcBtn');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                btn.textContent = "Calculating...";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  btn.disabled = true;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const url = `https://router.project-osrm.org/route/v1/driving/${startCoords.lon},${startCoords.lat};${endCoords.lon},${endCoords.lat}?overview=false`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const res = await fetch(url);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const data = await res.json();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!data.routes || data.routes.length === 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          alert("No route found between these locations.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const distanceKm = data.routes[0].distance / 1000;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const durationSeconds = data.routes[0].duration;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Time conversions
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const normalHours = Math.floor(durationSeconds / 3600);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const normalMinutes = Math.round((durationSeconds % 3600) / 60);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // 50 km/h heavy truck calculation
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const truckHoursTotal = distanceKm / 50;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const truckHours = Math.floor(truckHoursTotal);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const truckMinutes = Math.round((truckHoursTotal - truckHours) * 60);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // Fuel & Cost calculations
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const mileage = parseFloat(document.getElementById('mileage').value) || 2.5;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const fuelPrice = parseFloat(document.getElementById('fuelPrice').value) || 98.5;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const totalLitres = distanceKm / mileage;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const totalCost = totalLitres * fuelPrice;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Render results
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('resDist').textContent = `${distanceKm.toFixed(1)} km`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('resDuration').textContent = `${normalHours}h ${normalMinutes}m`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('resTruckDuration').textContent = `${truckHours}h ${truckMinutes}m`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('resFuel').textContent = `${totalLitres.toFixed(1)} Litres`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('resCost').textContent = `₹ ${Math.round(totalCost).toLocaleString('en-IN')}`;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('resultsBlock').style.display = 'block';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          } catch (err) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              alert("Error finding route. Please verify your connection.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } finally {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    btn.textContent = "Calculate Route & Cost";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        btn.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </html>
